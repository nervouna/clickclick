name: ClickClick
options:
  bundleIdPrefix: com.damao
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: T7976FL2LP
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  ClickClick:
    type: application
    platform: macOS
    sources:
      - path: ClickClick
        excludes:
          - Resources
      - path: ClickClick/Resources
        buildPhase: resources
        includes:
          - AppIcon.icon
    info:
      path: ClickClick/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Damao. All rights reserved.
    entitlements:
      path: ClickClick/Resources/ClickClick.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.usb: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.damao.clickclick
        PRODUCT_NAME: ClickClick
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - sdk: CoreHID.framework
      - sdk: IOKit.framework
      - sdk: libsqlite3.tbd
      - sdk: ServiceManagement.framework
      - sdk: Charts.framework
  ClickClickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClickClickTests
    dependencies:
      - target: ClickClick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.damao.clickclick.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ClickClick:
    build:
      targets:
        ClickClick: all
        ClickClickTests: [test]
    test:
      targets:
        - ClickClickTests
